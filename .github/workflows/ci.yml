name: ci
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test                      # xưng hô (Lớp 1, không LLM) + contract + Facade (mock + LLM giả) + reducer + CSS + cấu hình + Docker (nhất quán)
      - run: npm run poc:build
      - run: npm run test:images           # dựng lại cấu trúc từng image trong thư mục tạm và chạy thử
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm audit --audit-level=high
      # TODO: gitleaks (quét secret) + kiểm tra phạm vi task (Setup §8.1)

  docker:
    # Kiểm chứng đóng gói Docker thật (không chạy được trong môi trường phát triển của nhóm → chỉ chạy ở đây)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/config.json
          curl -fsS http://localhost:3001/remoteEntry.js -o /dev/null
          curl -fsS http://localhost:3002/remoteEntry.js -o /dev/null
          curl -fsS http://localhost:3003/remoteEntry.js -o /dev/null
          curl -fsS http://localhost:4000/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm test
        working-directory: apps/mobile
      - run: npx expo export --platform android --output-dir dist   # Metro đóng gói thật (xác nhận mọi import)
        working-directory: apps/mobile
        env: { CI: '1', EXPO_NO_TELEMETRY: '1', EXPO_OFFLINE: '1' }
