name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    # Chỉ chạy khi repo đã có package.json (sau spec 001)
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9   # chỉnh theo phiên bản pnpm bạn dùng
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
